services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-editorial-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ai_editorial}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-ai_editorial}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - ai_editorial_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_editorial} -d ${POSTGRES_DB:-ai_editorial}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  ai_editorial_postgres_data:
