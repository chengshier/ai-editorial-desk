name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ai_editorial
          POSTGRES_PASSWORD: ai_editorial_ci
          POSTGRES_DB: ai_editorial_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U ai_editorial -d ai_editorial_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://ai_editorial:ai_editorial_ci@127.0.0.1:55432/ai_editorial_test
      APP_SECRET_KEY: ci-only-secret-key-that-is-at-least-32-characters
      APP_ADMIN_TOKEN: ci-only-admin-token-at-least-24-characters

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy apps packages

      - name: M3 concurrent reprocess targeted
        run: timeout 90s pytest -q -s tests/test_clustering_reprocess_concurrency_m3d.py

      - name: Pytest
        shell: bash
        run: |
          set -o pipefail
          timeout 180s pytest -vv 2>&1 | tee pytest-output.log

      - name: Upload pytest diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: m3d-pytest-diagnostic
          path: pytest-output.log

      - name: M3 offline engineering evaluation
        run: python -m scripts.evaluate_m3_clustering --format text

      - name: M3 exact recall and clustering performance baseline
        run: pytest -q -s tests/test_clustering_performance_m3d.py

      - name: Full Alembic round trip
        run: |
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Connector definition sync is idempotent
        run: |
          python -m scripts.sync_connector_definitions
          python -m scripts.sync_connector_definitions

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install and generate lockfile
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --run

      - name: Production build
        run: npm run build

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: m1d-web-package-lock
          path: apps/web/package-lock.json
