name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ai_editorial
          POSTGRES_PASSWORD: ai_editorial_ci
          POSTGRES_DB: ai_editorial_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U ai_editorial -d ai_editorial_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://ai_editorial:ai_editorial_ci@127.0.0.1:55432/ai_editorial_test
      APP_SECRET_KEY: ci-only-secret-key-that-is-at-least-32-characters
      APP_ADMIN_TOKEN: ci-only-admin-token-at-least-24-characters

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy apps packages

      - name: Pytest
        shell: bash
        run: |
          set -o pipefail
          pytest -x -vv 2>&1 | tee pytest.log

      - name: Print pytest failure log
        if: failure()
        run: cat pytest.log

      - name: Alembic M1-C round trip
        run: |
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head

      - name: Connector definition sync is idempotent
        run: |
          python -m scripts.sync_connector_definitions
          python -m scripts.sync_connector_definitions

      - name: Full migration round trip
        run: |
          alembic downgrade base
          alembic upgrade head
